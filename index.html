<!doctype html><meta charset="utf-8"><title>Particle Playground</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fafafa;font-family:Segoe UI}.panel{position:absolute;top:15px;left:15px;background:#18181bcc;padding:14px;border-radius:10px}.panel input,.panel select{width:150px}.credit{position:absolute;bottom:10px;width:100%;text-align:center;font-size:11px;color:#a1a1aa}.credit a{color:#22d3ee}canvas{display:block}</style>
<canvas id="c"></canvas><div class="panel">Gravity <input id="g" type="range" min="-1" max="1" step=".05" value=".1"><br>Count <input id="n" type="range" min="100" max="1000" step="100" value="400"><br><select id="mode"><option>Rainbow</option><option>Fire</option><option>Ocean</option></select></div>
<div class="credit">Website developed by <a href="https://www.linkedin.com/company/souissi-technologies-development-group/home/">SOUISSI Technologies Development Group (STDG)</a><br>A Development Bureau for AI-Driven IT Projects. From Web Technologies to Autonomous Drones.</div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let w,h,m={x:-999,y:-999},ps=[];function resize(){w=c.width=innerWidth;h=c.height=innerHeight}onresize=resize;resize();
function init(){ps=[];for(let i=0;i<+n.value;i++)ps.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,s:1+Math.random()*2,h:Math.random()*360})}init();n.oninput=init;onpointermove=e=>m={x:e.x,y:e.y};
function draw(){ctx.fillStyle='rgba(9,9,11,.2)';ctx.fillRect(0,0,w,h);const mode=document.querySelector('#mode').value;for(const p of ps){let dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy)||1;if(d<160){p.vx+=dx/d*.04;p.vy+=dy/d*.04}p.vy+=+g.value*.025;p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.vy*=.995;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.fillStyle=mode=='Fire'?`hsl(${20+p.h*.04} 100% 60%)`:mode=='Ocean'?`hsl(${190+p.h*.1} 90% 60%)`:`hsl(${p.h} 90% 60%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}requestAnimationFrame(draw)}draw();
</script>
